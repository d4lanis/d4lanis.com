[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

[[redirects]]
  from = "/data-deletion"
  to = "/data-deletion/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
